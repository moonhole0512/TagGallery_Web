<!DOCTYPE html>
<html lang="ko" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.3/dist/darkly/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="#">
                <span class="text-primary">Tag</span>Gallery
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarContent">
                <!-- Search and Filter Group -->
                <div class="d-flex flex-grow-1 mx-lg-4 my-2 my-lg-0 align-items-center search-group">
                    <div class="input-group">
                        <input class="form-control" type="search" id="searchInput"
                            placeholder="Search tags (prompt, uc)...">
                        <button class="btn btn-primary" id="searchButton">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="11" cy="11" r="8"></circle>
                                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Selectors and Options -->
                <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-2 mb-2 mb-lg-0">
                    <select class="form-select" id="sortSelect">
                        <option value="random" selected>🎲 Random</option>
                        <option value="desc">🆕 Newest</option>
                        <option value="asc">⏳ Oldest</option>
                    </select>
                    <select class="form-select" id="platformSelect">
                        <option value="all" selected>🌐 All Platforms</option>
                        <option value="NovelAI">🎨 NovelAI</option>
                        <option value="StableDiffusion">🧠 StableDiffusion</option>
                        <option value="ComfyUI">🛠 ComfyUI</option>
                        <option value="none">❓ Unknown</option>
                    </select>
                    <div class="form-check form-switch ms-lg-2">
                        <input class="form-check-input" type="checkbox" id="videoOnlyCheckbox">
                        <label class="form-check-label text-light small no-wrap" for="videoOnlyCheckbox">Video
                            Only</label>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="d-flex gap-2 ms-lg-auto align-items-center">
                    <div id="scanProgress" class="spinner-grow spinner-grow-sm text-info me-2 d-none" role="status">
                        <span class="visually-hidden">Scanning...</span>
                    </div>
                    <button class="btn btn-outline-danger btn-sm" id="deleteModeButton">Delete</button>
                    <button class="btn btn-outline-info btn-sm" id="scanButton">Scan</button>
                    <button class="btn btn-outline-warning btn-sm" id="settingsButton" data-bs-toggle="modal"
                        data-bs-target="#settingsModal">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path
                                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container-fluid mt-5 pt-3">
        <div id="image-gallery">
            <!-- Images will be loaded here by JavaScript -->
        </div>
        <div id="loading-indicator" class="text-center my-4" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>
    </main>

    <!-- Settings Modal -->
    <div class="modal fade" id="settingsModal" tabindex="-1" aria-labelledby="settingsModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="settingsModalLabel">Settings</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="settingsForm">
                        <div class="mb-3">
                            <label for="image_file_path" class="form-label">Source Image Path</label>
                            <input type="text" class="form-control" id="image_file_path" required>
                            <div class="form-text">Path to the directory with unsorted images.</div>
                        </div>
                        <div class="mb-3">
                            <label for="des_file_path" class="form-label">Destination Image Path</label>
                            <input type="text" class="form-control" id="des_file_path" required>
                            <div class="form-text">Path where the sorted images will be stored.</div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary" id="saveSettingsButton">Save changes</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Image Detail Modal -->
    <div class="modal fade" id="imageDetailModal" tabindex="-1" aria-labelledby="imageDetailModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-xl">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="imageDetailModalLabel">Image Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body position-relative">
                    <!-- Navigation Buttons Overlay -->
                    <button class="btn btn-dark modal-nav-btn prev-btn" id="prevImageBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <button class="btn btn-dark modal-nav-btn next-btn" id="nextImageBtn">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>

                    <div class="row">
                        <div class="col-12 text-center mb-3">
                            <img id="detailImage" src="" class="img-fluid w-100" alt="Detailed view"
                                style="max-height: 70vh; object-fit: contain;">
                        </div>
                        <div class="col-12">
                            <h6>Metadata</h6>
                            <div id="metadata-container" class="p-2 rounded"
                                style="max-height: 40vh; overflow-y: auto;">
                                <!-- Metadata will be loaded here -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/main.js"></script>
</body>

</html>
